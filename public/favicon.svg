  <!-- Wok Handles -->
  <path d="M14 34 C10 33, 10 30, 14 29" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M50 34 C54 33, 54 30, 50 29" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Chopsticks -->
  <line x1="20" y1="12" x2="44" y2="38" stroke="#ECE7DF" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="10" x2="47" y2="35" stroke="#ECE7DF" stroke-width="2" stroke-linecap="round"/>
</svg>

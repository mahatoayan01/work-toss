  <path d="M26 30 C24 22, 28 16, 32 10 C34 16, 40 20, 36 30 Z" fill="url(#flame)"/>
  <path d="M22 28 C20 22, 24 18, 27 16 C26 21, 28 25, 27 28 Z" fill="#DC2626" opacity="0.9"/>
  <path d="M42 28 C44 22, 40 18, 37 16 C38 21, 36 25, 37 28 Z" fill="#F59E0B" opacity="0.9"/>
